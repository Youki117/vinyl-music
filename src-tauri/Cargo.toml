[package]
name = "vinyl-player"
version = "0.1.0"
description = "以视觉为第一卖点的本地音乐播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vinyl_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# AI 请求必须从 Rust 侧发：OpenAI 兼容的服务基本不给浏览器来源发 CORS 头，
# 从 WebView 直接 fetch 会被拦下。
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

# 系统媒体面板（任务栏/锁屏那个音乐控件）。Windows 上就是 SMTC，
# 自己调 windows-rs 要处理一堆 COM 生命周期，这个 crate 已经封好了。
[target.'cfg(target_os = "windows")'.dependencies]
souvlaki = "0.8"

[profile.release]
# 体积优先：PRD §7 要求安装包 < 20MB
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
