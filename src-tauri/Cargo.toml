[package]
name = "vinyl-player"
version = "0.1.0"
description = "以视觉为第一卖点的本地音乐播放器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "vinyl_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[profile.release]
# 体积优先：PRD §7 要求安装包 < 20MB
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
